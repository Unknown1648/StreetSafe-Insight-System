<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Registration - StreetSafe Insight</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: radial-gradient(circle at top, #0f172a, #1e293b);
      color: #e2e8f0;
    }

    .wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(920px, 100%);
      background: rgba(15, 23, 42, 0.92);
      border-radius: 26px;
      padding: 34px;
      border: 1px solid rgba(148,163,184,.2);
      box-shadow: 0 30px 90px rgba(0,0,0,.4);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 800;
    }

    .muted {
      color: #94a3b8;
      margin-top: 6px;
      margin-bottom: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      display: block;
      margin-bottom: 6px;
    }

    input, textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(148,163,184,.25);
      background: rgba(2,6,23,.6);
      color: white;
      outline: none;
      transition: 0.2s ease;
    }

    input:focus, textarea:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59,130,246,.15);
    }

    textarea {
      resize: none;
    }

    .full {
      grid-column: 1 / -1;
    }

    .section-title {
      margin-top: 18px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #93c5fd;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      transition: 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(37,99,235,.3);
    }

    .alert {
      display: none;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .alert.show {
      display: block;
    }

    .alert-error {
      background: rgba(127,29,29,.5);
      color: #fecaca;
    }

    .alert-success {
      background: rgba(20,83,45,.5);
      color: #bbf7d0;
    }

    .links {
      margin-top: 18px;
      font-size: 0.9rem;
    }

    .links a {
      color: #7dd3fc;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    @media (max-width: 760px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <h1>Community Registration</h1>
    <p class="muted">
      Join StreetSafe Insight to report incidents, receive safety alerts, and help improve your neighborhood safety.
    </p>

    <div id="alert" class="alert"></div>

    <form id="register-form" class="grid">

      <!-- Identity Section -->
      <div class="full section-title">Personal Information</div>

      <div>
        <label>Full Name</label>
        <input id="full-name" placeholder="Your full name">
      </div>

      <div>
        <label>Display Name</label>
        <input id="display-name" placeholder="Public display name">
      </div>

      <div>
        <label>Email</label>
        <input id="email" type="email" placeholder="name@example.com">
      </div>

      <div>
        <label>Phone</label>
        <input id="phone" placeholder="Phone number">
      </div>

      <!-- Security -->
      <div class="full section-title">Account Security</div>

      <div class="full">
        <label>Password</label>
        <input id="password" type="password" placeholder="Create a strong password" required>
      </div>

      <!-- Location -->
      <div class="full section-title">Location Details</div>

      <div>
        <label>Neighborhood</label>
        <input id="neighborhood" placeholder="Your neighborhood">
      </div>

      <div>
        <label>Address</label>
        <input id="address" placeholder="Street / estate / area">
      </div>

      <!-- Profile -->
      <div class="full section-title">Profile Preferences</div>

      <div class="full">
        <label>Profile Note</label>
        <textarea id="profile-note" rows="3" placeholder="Optional note for officers"></textarea>
      </div>

      <div class="full">
        <label>
          <input id="personal-details-public" type="checkbox" style="width:auto; margin-right:8px;">
          Make my personal details visible on my profile
        </label>
      </div>

      <!-- Submit -->
      <div class="full">
        <button class="btn" type="submit">
          Create Account
        </button>
      </div>

    </form>

    <div class="links">
      <a href="login.html">Back to login</a> |
      <a href="index.html">Public dashboard</a>
    </div>

  </div>
</div>

<script type="module">
  import { authManager } from './js/core/auth.js';

  const alertBox = document.getElementById('alert');

  function showAlert(message, type) {
    alertBox.textContent = message;
    alertBox.className = `alert show alert-${type}`;
  }

  document.getElementById('register-form').addEventListener('submit', async (event) => {
    event.preventDefault();

    try {
      await authManager.registerCommunity({
        full_name: document.getElementById('full-name').value,
        display_name: document.getElementById('display-name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        password: document.getElementById('password').value,
        neighborhood: document.getElementById('neighborhood').value,
        address: document.getElementById('address').value,
        profile_note: document.getElementById('profile-note').value,
        personal_details_public: document.getElementById('personal-details-public').checked
      });

      showAlert('Account created successfully. Redirecting...', 'success');
      setTimeout(() => window.location.href = 'community-dashboard.html', 800);

    } catch (err) {
      showAlert(err.message || 'Registration failed', 'error');
    }
  });
</script>

</body>
</html>
