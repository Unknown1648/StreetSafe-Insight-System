<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreetSafe Insight - Login</title>

  <style>
    :root{
      --primary:#2563eb;
      --dark:#0f172a;
      --bg:#0b1220;
      --card:#111827;
      --border:rgba(148,163,184,.2);
      --muted:#94a3b8;
      --text:#e2e8f0;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:'Segoe UI',system-ui,sans-serif;
      background: radial-gradient(circle at top, #1e293b, #0b1220);
      color:var(--text);
    }

    .auth-shell{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
    }

    .auth-card{
      width:min(520px,100%);
      background:rgba(17,24,39,.85);
      border:1px solid var(--border);
      border-radius:24px;
      box-shadow:0 30px 80px rgba(0,0,0,.45);
      padding:28px;
      backdrop-filter:blur(12px);
    }

    /* BRAND */
    .brand{
      font-size:1.8rem;
      font-weight:800;
      margin-bottom:6px;
    }

    .muted{
      color:var(--muted);
      font-size:.95rem;
      margin-bottom:18px;
    }

    /* ROLE SWITCH */
    .role-switch{
      display:flex;
      gap:10px;
      margin-bottom:18px;
    }

    .role-btn{
      flex:1;
      padding:10px;
      border-radius:12px;
      border:1px solid var(--border);
      background:transparent;
      color:var(--text);
      cursor:pointer;
      font-weight:600;
      transition:.2s;
    }

    .role-btn.active{
      background:var(--primary);
      border-color:var(--primary);
    }

    /* FORM */
    form{
      display:none;
      flex-direction:column;
      gap:12px;
    }

    form.active{
      display:flex;
    }

    label{
      font-size:.9rem;
      font-weight:600;
    }

    input{
      padding:12px 14px;
      border-radius:12px;
      border:1px solid var(--border);
      background:rgba(0,0,0,.2);
      color:var(--text);
      outline:none;
    }

    input:focus{
      border-color:var(--primary);
    }

    button{
      padding:12px;
      border-radius:12px;
      border:none;
      background:linear-gradient(135deg,#2563eb,#3b82f6);
      color:white;
      font-weight:700;
      cursor:pointer;
      transition:.2s;
    }

    button:hover{
      transform:translateY(-2px);
    }

    /* ALERT */
    .alert{
      display:none;
      padding:12px;
      border-radius:12px;
      margin-bottom:14px;
      font-size:.9rem;
    }

    .alert.show{ display:block; }

    .alert-error{
      background:rgba(127,29,29,.5);
      color:#fecaca;
    }

    .alert-success{
      background:rgba(20,83,45,.5);
      color:#bbf7d0;
    }

    /* LINKS */
    .links{
      margin-top:14px;
      display:flex;
      justify-content:space-between;
      font-size:.85rem;
    }

    .links a{
      color:#60a5fa;
      text-decoration:none;
    }

    .notice{
      margin-top:16px;
      padding:12px;
      border-radius:14px;
      background:rgba(30,41,59,.6);
      border:1px solid var(--border);
      font-size:.85rem;
      color:var(--muted);
    }

  </style>
</head>

<body>

<div class="auth-shell">
  <div class="auth-card">

    <div class="brand">🛡 StreetSafe Insight</div>
    <div class="muted">Secure access to your safety dashboard</div>

    <div id="alert" class="alert"></div>

    <!-- ROLE SWITCH -->
    <div class="role-switch">
      <button type="button" class="role-btn active" id="community-tab">Community</button>
      <button type="button" class="role-btn" id="police-tab">Police</button>
    </div>

    <!-- COMMUNITY LOGIN -->
    <form id="community-login-form" class="active">
      <label>Email or Phone</label>
      <input id="community-identifier" autocomplete="username" placeholder="name@example.com or phone" required>

      <label>Password</label>
      <input id="community-password" type="password" autocomplete="current-password" required>

      <button type="submit">Login</button>
    </form>

    <!-- POLICE LOGIN -->
    <form id="police-login-form">
      <label>Badge Number or Email</label>
      <input id="police-identifier" autocomplete="username" required>

      <label>Password</label>
      <input id="police-password" type="password" autocomplete="current-password" required>

      <button type="submit">Login</button>
    </form>

    <div class="links">
      <a href="register.html">Create account</a>
      <a href="index.html">Public dashboard</a>
    </div>

    <div class="notice">
      Police accounts are issued by the nearest admin office. No online registration available.
    </div>

  </div>
</div>

<script type="module">
  import { authManager } from './js/core/auth.js';

  const alertBox = document.getElementById('alert');

  function showAlert(message, type){
    alertBox.textContent = message;
    alertBox.className = `alert show alert-${type}`;
  }

  function switchRole(role){
    document.getElementById('community-login-form').classList.toggle('active', role==='community');
    document.getElementById('police-login-form').classList.toggle('active', role==='police');

    document.getElementById('community-tab').classList.toggle('active', role==='community');
    document.getElementById('police-tab').classList.toggle('active', role==='police');
  }

  document.getElementById('community-tab').onclick = () => switchRole('community');
  document.getElementById('police-tab').onclick = () => switchRole('police');

  async function handleLogin(role, idField, passField, redirect){
    const id = document.getElementById(idField).value.trim();
    const pw = document.getElementById(passField).value;

    if(!id || !pw){
      showAlert("Please fill all fields","error");
      return;
    }

    try{
      await authManager.login(role, id, pw);
      showAlert("Login successful","success");

      setTimeout(()=> window.location.href = redirect, 800);

    }catch(err){
      showAlert(err.message || "Login failed","error");
    }
  }

  document.getElementById('community-login-form').addEventListener('submit', (e)=>{
    e.preventDefault();
    handleLogin('community','community-identifier','community-password','community-dashboard.html');
  });

  document.getElementById('police-login-form').addEventListener('submit', (e)=>{
    e.preventDefault();
    handleLogin('police','police-identifier','police-password','police.html');
  });

</script>

</body>
</html>
